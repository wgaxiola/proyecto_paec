<h1 style="color: #2e7d32;">¿Qué es una composta?</h1>
<p>Es el resultado de descomponer restos de frutas, verduras, hojas secas y pasto con ayuda de
microorganismos, hongos y lombrices.</p>
<h2>Beneficios</h2>
<ul>
<li>Mejora la tierra</li>
<li>Reduce la basura</li>
<li>Ayuda a que las plantas crezcan sanas</li>
<li>No contamina</li>
</ul>
